<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MXU Beam/Gate – Pure</title>
</head>

<body>

<h1>MXU Beam/Gate – Reinheit</h1>

<!-- Drei reine Punkte: Ort / Home / User -->
<div id="inst-root" data-gate="gate-root" data-beam="bp-1"></div>
<div id="inst-axis" data-gate="gate-axis" data-beam="bp-2"></div>
<div id="inst-room" data-gate="gate-room" data-beam="bp-3"></div>

<script type="module">
  import * as MXU from "./mxu.js";

  // Reinheitsgehalt: nur 3 Punkte, keine Erweiterung
  const root = document.getElementById("inst-root");
  const axis = document.getElementById("inst-axis");
  const room = document.getElementById("inst-room");

  root.textContent = "ROOT • Rein";
  axis.textContent = "AXIS • Rein";
  room.textContent = "ROOM • Rein";

  // Minimaler MXU-Startpunkt
  MXU.channel("inst-root");
</script>

</body>
</html>
