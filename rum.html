<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RUM.EXE – MXU Sequencer</title>
</head>

<body>

<div id="seq-root"></div>
<div id="seq-axis"></div>
<div id="seq-room"></div>

<script type="module">
  import * as MXU from "./mxu.js";

  // 9 → 81 → 9 Sequencer
  function sequencer(input = "") {
    return {
      start9: input.slice(0, 9),          // erster 9er Block
      core81: input.slice(0, 81),         // 81er Kern
      end9: input.slice(-9),              // letzter 9er Block
      length: input.length,
      cycle: 9 + 81 + 9
    };
  }

  const msg = "MXU-SEQUENCER-AKTIV";      // egal welche Zeichen
  const seq = sequencer(msg);

  document.getElementById("seq-root").textContent =
    "ROOT 9: " + seq.start9;

  document.getElementById("seq-axis").textContent =
    "AXIS 81: " + seq.core81;

  document.getElementById("seq-room").textContent =
    "ROOM 9: " + seq.end9;
</script>

</body>
</html>
