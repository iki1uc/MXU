<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MXU Sequencer</title>
</head>

<body>

<div id="inst-root" data-gate="gate-root" data-beam="bp-1"></div>
<div id="inst-axis" data-gate="gate-axis" data-beam="bp-2"></div>
<div id="inst-room" data-gate="gate-room" data-beam="bp-3"></div>

<script type="module">
  import * as MXU from "./mxu.js";

  // 9 → 81 → 9 Sequencer
  function seq(input = "") {
    return {
      root9:  input.slice(0, 9),     // Start
      axis81: input.slice(0, 81),    // Kern
      room9:  input.slice(-9),       // Ende
      len: input.length
    };
  }

  const msg = "MXU-SEQUENCER-AKTIV-INPUT";   // egal welche Zeichen
  const s = seq(msg);

  document.getElementById("inst-root").textContent =
    "ROOT 9 → " + s.root9;

  document.getElementById("inst-axis").textContent =
    "AXIS 81 → " + s.axis81;

  document.getElementById("inst-room").textContent =
    "ROOM 9 → " + s.room9;
</script>

</body>
</html>
