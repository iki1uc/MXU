<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MXU Beam/Gate</title>
</head>

<body>

<h1>MXU Beam/Gate</h1>

<div id="inst-root" data-gate="gate-root" data-beam="bp-1" data-anchor="ax-root"></div>
<div id="inst-axis" data-gate="gate-axis" data-beam="bp-2" data-anchor="ax-axis"></div>
<div id="inst-room" data-gate="gate-room" data-beam="bp-3" data-anchor="ax-room"></div>

<script type="module">
  import * as MXU from "./mxu.js";

  // 3 → 9 Diamant
  function diamond(input = "") {
    return {
      ort:  input.slice(0, 3),
      home: input.slice(3, 6),
      user: input.slice(6, 9),

      use:  input.slice(0, 9),
      rumUse: input.slice(-9),
      rumUser: input.slice(-3),

      len: input.length
    };
  }

  const msg = "MXU-BEAM-GATE-ANCHOR-DIAMANT-API-RESPONDER";
  const d = diamond(msg);

  document.getElementById("inst-root").textContent =
    "ROOT → " + d.ort;

  document.getElementById("inst-axis").textContent =
    "AXIS → " + d.home;

  document.getElementById("inst-room").textContent =
    "ROOM → " + d.user;

  MXU.channel("inst-root");
</script>

</body>
</html>
